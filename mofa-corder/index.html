<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Scratchライク エディタ</title>
    
    <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
    <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
    <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
    <script src="https://unpkg.com/blockly/msg/ja.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div>Mofa Coder</div>
    </header>

    <div class="main-container">
        <div class="editor-panel">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('blocks')">ブロック</button>
                <button class="tab-btn" onclick="switchTab('code')">JavaScriptコード</button>
                <button class="tab-btn" onclick="switchTab('html')">HTMLコード</button>
            </div>
            
            <div id="blocklyDiv"></div>
            <div id="codeDiv">
                <textarea id="codeOutput"></textarea>
            </div>
            <div id="htmlDiv" style="display: none; flex: 1;">
                <textarea id="htmlEditor" style="width: 100%; height: 100%; border: none; padding: 10px; font-family: monospace; font-size: 14px; resize: none; background: #1e1e1e; color: #d4d4d4; tab-size: 2; box-sizing: border-box;"></textarea>
            </div>
        </div>

        <div class="stage-panel">
            <div class="stage-header">
                <button class="run-btn" onclick="runCode()">▶ 実行 (プログラムを反映)</button>
            </div>
            <iframe id="playground" style="flex: 1; border: none;"></iframe>
        </div>
    </div>

    <xml id="toolbox" style="display: none">
        <category name="イベント" colour="#FFBF00">
            <block type="event_class_clicked"></block>
        </category>
        <category name="見た目 / アクション" colour="#4C97FF">
            <block type="action_alert"></block>
            <block type="text_print"></block>
        </category>
        <category name="テキスト" colour="%{BKY_TEXTS_HUE}">
            <block type="text"></block>
        </category>
    </xml>

    <script src="script.js"></script>
</body>
</html>
