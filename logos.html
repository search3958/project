<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Assets</title>

    <style>
        * {
            box-sizing: border-box;
        }

        footer {
    padding: 48px 0px;
    padding-top: 15px;
    text-align: center;
    font-size: 20px;
} 
a{
    text-decoration: none;
    color: #000;
}
        html {
            margin: 0;
            padding: 0;
            background: #fff;
        }

        body {
            margin: 0;
            padding: 40px;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans JP",
                sans-serif;
            background: #fff;
            color: #111;
            overflow-x: hidden;
            padding-top:80px!important;
        }

        .brand-assets-page {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        .brand-assets-header {
            margin-bottom: 40px;
        }

        .brand-assets-header h1 {
            margin: 0 0 10px;
            font-size: clamp(32px, 5vw, 56px);
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        .brand-assets-header p {
            margin: 0;
            color: #666;
            font-size: 15px;
            line-height: 1.7;
        }

        .brand-assets-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .brand-assets-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            aspect-ratio: 1 / 1;
            padding: 48px;
            background: #f6f6f6;
            overflow: hidden;
            border-radius:32px;
    corner-shape: superellipse(1.5);
        }

        .brand-assets-card img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.2s ease;
        }

        .brand-assets-card:hover img {
            transform: scale(1.03);
        }

        .brand-assets-actions {
            position: absolute;
            right: 12px;
            bottom: 12px;
            display: flex;
            gap: 8px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(6px);
            transition:
                opacity 0.18s ease,
                visibility 0.18s ease,
                transform 0.18s ease;
                
        }

        .brand-assets-card:hover .brand-assets-actions,
        .brand-assets-card:focus-within .brand-assets-actions {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .brand-assets-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 72px;
            height: 36px;
            padding: 0 12px;
            box-shadow:0 2px 8px #0001;
            border-radius: 99px;
            background: #fff;
            border:none;
            color: #111;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition:
                background 0.15s ease,
                border-color 0.15s ease;

    corner-shape: superellipse(1.5);
        }

        .brand-assets-action:hover {
            background: #f0f0f0;
        }

        .brand-assets-footer {
            margin-top: 48px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: center;
            font-size: 12px;
            color: #999;
        }

        #brand-assets-toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            z-index: 1000;
            padding: 10px 14px;
            border-radius: 6px;
            background: #111;
            color: #fff;
            font-size: 13px;
            line-height: 1.4;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translate(-50%, 10px);
            transition:
                opacity 0.2s ease,
                visibility 0.2s ease,
                transform 0.2s ease;
        }

        #brand-assets-toast.is-visible {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
        }

        @media (min-width: 700px) {
            .brand-assets-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (min-width: 980px) {
            .brand-assets-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (min-width: 1280px) {
            .brand-assets-grid {
                grid-template-columns: repeat(5, minmax(0, 1fr));
            }
        }

        @media (max-width: 699px) {
            body {
                padding: 24px;
            }

            .brand-assets-card {
                padding: 22px;
            }
        }

        @media (max-width: 420px) {
            body {
                padding: 16px;
            }

            .brand-assets-grid {
                gap: 10px;
            }

            .brand-assets-card {
                padding: 16px;
            }

            .brand-assets-action {
                min-width: 64px;
                height: 32px;
                padding: 0 9px;
                font-size: 12px;
            }

            .brand-assets-actions {
                right: 8px;
                bottom: 8px;
                gap: 5px;
            }
        }
    </style>
</head>

<body>
    <div class="brand-assets-page">
        <header class="brand-assets-header">
            <h1>Brand Assets</h1>
            <p>ロゴをクリックせず、そのまま確認できます。ホバーするとコピーとダウンロードを利用できます。</p>
        </header>

        <main id="brand-assets-grid" class="brand-assets-grid"></main>

        <footer class="brand-assets-footer">
            © 2026
        </footer>
    </div>

    <div id="brand-assets-toast" role="status" aria-live="polite"></div>

    <script>
        (() => {
            "use strict";

            const logoPaths = [
                "logos/3dspace-main.svg",
                "logos/3958logo_dot.svg",
                "logos/3958logo_flat.svg",
                "logos/3958logo_glass.svg",
                "logos/3958logo_m3.svg",
                "logos/3958logo_main.svg",
                "logos/3958logo_v1.svg",
                "logos/baramcode_main.png",
                "logos/docs-main.svg",
                "logos/games-main.svg",
                "logos/hwawondae-main.svg",
                "logos/newtab_main.webp",
                "logos/saetab_main.webp",
                "logos/techpick10-main.svg",
                "logos/toolboard-main.svg"
            ];

            const grid = document.getElementById("brand-assets-grid");
            if (!grid) {
                console.error("[BrandAssets] #brand-assets-grid が見つかりません。");
                return;
            }

            const toast = document.getElementById("brand-assets-toast");
            if (!toast) {
                console.error("[BrandAssets] #brand-assets-toast が見つかりません。");
            }

            let toastTimer = null;

            const showToast = (message) => {
                if (!toast) {
                    console.error("[BrandAssets] トースト表示先がありません:", message);
                    return;
                }

                toast.textContent = message;
                toast.classList.add("is-visible");

                if (toastTimer !== null) {
                    clearTimeout(toastTimer);
                }

                toastTimer = setTimeout(() => {
                    if (!toast) {
                        console.error("[BrandAssets] トースト要素が存在しません。");
                        return;
                    }

                    toast.classList.remove("is-visible");
                    toastTimer = null;
                }, 1800);
            };

            const getAssetUrl = (path) => {
                try {
                    return new URL(path, window.location.href).href;
                } catch (error) {
                    console.error("[BrandAssets] URL生成に失敗しました:", path, error);
                    return null;
                }
            };

            const copyAssetUrl = async (path) => {
                const fullUrl = getAssetUrl(path);

                if (!fullUrl) {
                    console.error("[BrandAssets] コピー対象URLを生成できません:", path);
                    return;
                }

                if (!navigator.clipboard || typeof navigator.clipboard.writeText !== "function") {
                    console.error("[BrandAssets] Clipboard API が利用できません。");
                    showToast("コピーに対応していません");
                    return;
                }

                try {
                    await navigator.clipboard.writeText(fullUrl);
                    console.log("[BrandAssets] URLをコピーしました:", fullUrl);
                    showToast("コピーしました");
                } catch (error) {
                    console.error("[BrandAssets] URLコピーに失敗しました:", error);
                    showToast("コピーに失敗しました");
                }
            };

            const createCard = (path) => {
                const card = document.createElement("article");
                if (!card) {
                    console.error("[BrandAssets] カード要素の生成に失敗しました:", path);
                    return null;
                }

                card.className = "brand-assets-card";

                const image = document.createElement("img");
                if (!image) {
                    console.error("[BrandAssets] 画像要素の生成に失敗しました:", path);
                    return null;
                }

                image.src = path;
                image.alt = "";
                image.loading = "lazy";
                image.decoding = "async";

                image.addEventListener("error", () => {
                    console.error("[BrandAssets] ロゴの読み込みに失敗しました:", path);
                });

                image.addEventListener("load", () => {
                    console.log("[BrandAssets] ロゴを読み込みました:", path);
                });

                const actions = document.createElement("div");
                if (!actions) {
                    console.error("[BrandAssets] アクション領域の生成に失敗しました:", path);
                    return null;
                }

                actions.className = "brand-assets-actions";

                const copyButton = document.createElement("button");
                if (!copyButton) {
                    console.error("[BrandAssets] コピー按钮の生成に失敗しました:", path);
                    return null;
                }

                copyButton.type = "button";
                copyButton.className = "brand-assets-action";
                copyButton.textContent = "コピー";
                copyButton.setAttribute("title", "URLをコピー");
                copyButton.addEventListener("click", () => {
                    void copyAssetUrl(path);
                });

                const downloadLink = document.createElement("a");
                if (!downloadLink) {
                    console.error("[BrandAssets] ダウンロードリンクの生成に失敗しました:", path);
                    return null;
                }

                const assetUrl = getAssetUrl(path);
                if (!assetUrl) {
                    console.error("[BrandAssets] ダウンロードURLを生成できません:", path);
                    return null;
                }

                downloadLink.className = "brand-assets-action";
                downloadLink.href = assetUrl;
                downloadLink.download = "";
                downloadLink.textContent = "ダウンロード";
                downloadLink.setAttribute("title", "ダウンロード");

                downloadLink.addEventListener("click", () => {
                    console.log("[BrandAssets] ダウンロードを開始しました:", path);
                });

                actions.appendChild(copyButton);
                actions.appendChild(downloadLink);

                card.appendChild(image);
                card.appendChild(actions);

                return card;
            };

            let createdCount = 0;

            for (const path of logoPaths) {
                const card = createCard(path);

                if (!card) {
                    console.error("[BrandAssets] カード作成をスキップしました:", path);
                    continue;
                }

                grid.appendChild(card);
                createdCount += 1;
            }

            console.log(
                "[BrandAssets] 初期化完了。登録数:",
                logoPaths.length,
                "作成数:",
                createdCount
            );
        })();
    </script>

    <script src="https://search3958.github.io/frameworks/headerv2.js"></script>

<script src="https://search3958.github.io/check.js?check=none"></script>
</body>
</html>
