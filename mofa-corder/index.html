<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Mofa Coder</title>
    
    <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
    <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
    <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
    <script src="https://unpkg.com/blockly/msg/ja.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 16px;">
            <span style="font-weight: 500;">Mofa Coder</span>
            <div class="file-menu">
                <button class="file-menu-btn" onclick="toggleFileMenu()">
                    ファイル
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="margin-left: 4px;">
                        <path d="M3 5L6 8L9 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <div class="file-menu-dropdown" id="fileMenuDropdown">
                    <button class="file-menu-item" onclick="downloadProject()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                        </svg>
                        ダウンロード
                    </button>
                    <button class="file-menu-item" onclick="loadProject()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                        </svg>
                        読み込み
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <div class="editor-panel">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('blocks')">ブロック</button>
                <button class="tab-btn" onclick="switchTab('code')">コード</button>
                <button class="tab-btn" onclick="switchTab('uiscript')">UIScript</button>
            </div>
            
            <div id="blocklyDiv"></div>
            <div id="codeDiv">
                <textarea id="codeOutput"></textarea>
            </div>
            <div id="uiscriptDiv" style="display: none; flex: 1;">
                <textarea id="uiscriptEditor" spellcheck="false"></textarea>
            </div>
        </div>

        <div class="stage-panel">
            <div class="stage-header">
                <button class="run-btn" onclick="runUIScript()">▶ 実行</button>
                <button class="run-btn run-btn--secondary" onclick="toggleVariableViewer()">変数ビューア</button>
            </div>
            <div id="variableWindow" class="variable-window is-hidden">
                <div id="variableWindowHeader" class="variable-window__header">
                    <span>変数ビューア</span>
                    <div class="variable-window__controls">
                        <span class="variable-window__badge">Drag</span>
                        <button class="variable-window__close" onclick="closeVariableViewer()" aria-label="閉じる">×</button>
                    </div>
                </div>
                <div id="variableViewer" class="variable-window__list"></div>
            </div>
            <div id="playground"></div>
        </div>
    </div>

    <xml id="toolbox" style="display: none">
        <category name="レイアウト" colour="#3498db">
            <block type="layout_set"></block>
            <block type="layout_mode"></block>
        </category>
        <category name="見た目" colour="#9b59b6">
            <block type="effect_set"></block>
            <block type="effect_filter"></block>
        </category>
        <category name="イベント" colour="#FFBF00">
            <block type="event_loaded"></block>
            <block type="event_clicked"></block>
            <block type="event_click"></block>
            <block type="event_key"></block>
            <block type="event_getMessage"></block>
            <block type="event_sendMessage"></block>
        </category>
        <category name="制御" colour="#FF6B6B">
            <block type="control_wait"></block>
            <block type="control_for"></block>
            <block type="control_forever"></block>
            <block type="control_if"></block>
            <block type="control_waitFor"></block>
            <block type="control_role"></block>
        </category>
        <category name="変数" colour="#9b59b6">
            <block type="var_set"></block>
            <block type="var_get"></block>
            <block type="var_number"></block>
            <block type="var_string"></block>
            <block type="var_builtin"></block>
        </category>
        <category name="演算" colour="#9b59b6">
            <block type="math_binop"></block>
            <block type="math_long"></block>
            <block type="math_include"></block>
        </category>
        <category name="論理" colour="#FF6B6B">
            <block type="logic_compare"></block>
            <block type="logic_operation"></block>
            <block type="logic_not"></block>
        </category>
    </xml>

    <script type="module" src="script.js"></script>
</body>
</html>
