<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Mofa Coder</title>
    
    <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
    <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
    <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
    <script src="https://unpkg.com/blockly/msg/ja.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div>Mofa Coder</div>
    </header>

    <div class="main-container">
        <div class="editor-panel">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('blocks')">ブロック</button>
                <button class="tab-btn" onclick="switchTab('code')">JavaScriptコード</button>
                <button class="tab-btn" onclick="switchTab('uiscript')">UIScriptコード</button>
            </div>
            
            <div id="blocklyDiv"></div>
            <div id="codeDiv">
                <textarea id="codeOutput"></textarea>
            </div>
            <div id="uiscriptDiv" style="display: none; flex: 1;">
                <textarea id="uiscriptEditor" spellcheck="false"></textarea>
            </div>
        </div>

        <div class="stage-panel">
            <div class="stage-header">
                <button class="run-btn" onclick="runUIScript()">▶ 実行</button>
            </div>
            <div id="playground"></div>
        </div>
    </div>

    <xml id="toolbox" style="display: none">
        <category name="UIScript要素" colour="#4C97FF">
            <block type="uiscript_button"></block>
            <block type="uiscript_text"></block>
            <block type="uiscript_heading"></block>
            <block type="uiscript_input"></block>
        </category>
        <category name="JS連携" colour="#FF6B6B">
            <block type="uiscript_on_click"></block>
            <block type="uiscript_set_text"></block>
            <block type="uiscript_get_text"></block>
            <block type="uiscript_alert"></block>
        </category>
        <category name="テキスト" colour="%{BKY_TEXTS_HUE}">
            <block type="text"></block>
        </category>
    </xml>

    <script type="module" src="script.js"></script>
</body>
</html>
