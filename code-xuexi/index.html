<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CODE言然</title>
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0900FF" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- ZIP展開用。アプリ本体はビルド不要の単一HTMLです。 -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    :root{
      color-scheme: light;
      --md-primary:#0900FF;
      --md-on-primary:#ffffff;
      --md-primary-container:#EEEEEE;
      --md-on-primary-container:#212121;
      --md-secondary:#616161;
      --md-secondary-container:#EEEEEE;
      --md-on-secondary-container:#212121;
      --md-tertiary:#7C526B;
      --md-surface:#FAFAFA;
      --md-surface-container-low:#FFFFFF;
      --md-surface-container:#FFFFFF;
      --md-surface-container-high:#F5F5F5;
      --md-surface-container-highest:#EEEEEE;
      --md-on-surface:#212121;
      --md-on-surface-variant:#616161;
      --md-outline:#79747E;
      --md-outline-variant:#CAC4D0;
      --md-error:#ba1a1a;
      --md-shadow:0 2px 4px rgba(0,0,0,.18);
      --radius-xl:8px;
      --radius-lg:8px;
      --radius-md:8px;
      --split:58%;
      --topbar-h:calc(72px + env(safe-area-inset-top));
      font-family: Inter, "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark){
      :root{
        color-scheme: dark;
        --md-primary:#0900FF;
        --md-on-primary:#FFFFFF;
        --md-primary-container:#3C3D41;
        --md-on-primary-container:#FFFFFF;
        --md-secondary:#BDBDBD;
        --md-secondary-container:#3C3D41;
        --md-on-secondary-container:#FFFFFF;
        --md-tertiary:#e5bad9;
        --md-surface:#000000;
        --md-surface-container-low:#0D0D0F;
        --md-surface-container:#111113;
        --md-surface-container-high:#18181B;
        --md-surface-container-highest:#232326;
        --md-on-surface:#F5F5F5;
        --md-on-surface-variant:#A7A7AD;
        --md-outline:#66666C;
        --md-outline-variant:#38383D;
        --md-error:#ffb4ab;
        --md-shadow:0 2px 4px rgba(0,0,0,.42);
      }
    }

    *{box-sizing:border-box;user-select:none;-webkit-user-select:none}
    html,body{height:100%;margin:0;overflow:hidden;background:var(--md-surface);color:var(--md-on-surface)}
    button,input{font:inherit}
    button{color:inherit}
    svg{display:block}

    .app{
      height:100dvh;
      min-height:520px;
      display:grid;
      grid-template-rows:var(--topbar-h) minmax(0,1fr);
      background:var(--md-surface);
    }

    .topbar{
      min-width:0;
      display:flex;
      align-items:center;
      gap:12px;
      padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
      border-bottom:0;
      background:var(--md-surface-container);
      box-shadow:0 2px 4px rgba(0,0,0,.16);
      z-index:20;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      margin-right:auto;
    }
    .brand-mark{
      width:42px;height:42px;border-radius:4px;
      display:grid;place-items:center;
      color:var(--md-on-primary);
      background:var(--md-primary);
      box-shadow:0 2px 4px rgba(0,0,0,.2);
      flex:none;
    }
    .brand-mark img{display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit}
    .brand-copy{min-width:0}
    .brand-title{font-weight:730;letter-spacing:-.02em;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brand-sub{font-size:12px;color:var(--md-on-surface-variant);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .btn{
      height:44px;
      border:0;
      border-radius:4px;
      padding:0 18px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      cursor:pointer;
      position:relative;
      overflow:hidden;
      transition:background .12s ease,box-shadow .12s ease,opacity .12s ease;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
      white-space:nowrap;
    }
    .btn:active{transform:scale(.98)}
    .ripple{
      position:absolute;border-radius:50%;pointer-events:none;
      width:18px;height:18px;background:currentColor;opacity:.16;
      transform:translate(-50%,-50%) scale(0);
      animation:ripple .32s cubic-bezier(.2,0,0,1) forwards;
    }
    @keyframes ripple{to{transform:translate(-50%,-50%) scale(10);opacity:0}}
    .btn-filled{
      color:var(--md-on-primary);
      background:var(--md-primary);
      box-shadow:0 2px 4px rgba(0,0,0,.18);
    }
    .btn-tonal{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
    .btn-plain{background:transparent;color:var(--md-on-surface-variant)}
    .btn-icon{
      width:44px;padding:0;border-radius:50%;
      background:transparent;
    }
    .btn:disabled{opacity:.38;cursor:default;transform:none;box-shadow:none}

    #zipInput{display:none}

    .workspace{
      min-height:0;
      position:relative;
      display:grid;
      grid-template-rows:minmax(150px,var(--split)) 12px minmax(155px,1fr);
      padding:10px 12px 12px;
    }

    .pane{
      min-height:0;
      min-width:0;
      overflow:hidden;
      border:0;
      background:var(--md-surface-container-low);
      box-shadow:var(--md-shadow);
    }
    .viewer-pane{border-radius:var(--radius-xl)}
    .files-pane{border-radius:var(--radius-xl)}

    .resizer{
      position:relative;
      z-index:15;
      cursor:row-resize;
      touch-action:none;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .resizer::before{
      content:"";
      width:52px;height:4px;border-radius:999px;
      background:var(--md-outline);
      opacity:.55;
      transition:width .15s ease,opacity .15s ease;
    }
    .resizer.dragging::before{width:76px;opacity:.9}

    /* viewer */
    .viewer-pane{
      display:grid;
      grid-template-rows:58px minmax(0,1fr);
    }
    .viewer-toolbar{
      display:flex;
      align-items:center;
      min-width:0;
      gap:10px;
      padding:8px 10px 8px 16px;
      border-bottom:1px solid var(--md-outline-variant);
      background:var(--md-surface-container-high);
    }
    .file-meta{
      display:flex;
      align-items:center;
      gap:11px;
      min-width:0;
      margin-right:auto;
    }
    .mini-file-icon{
      width:34px;height:34px;border-radius:4px;
      display:grid;place-items:center;
      flex:none;
      background:var(--md-surface-container-high);
      color:var(--md-on-surface-variant);
    }
    .file-meta-text{min-width:0}
    .active-file{
      font-size:14px;font-weight:680;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .active-path{
      margin-top:2px;
      font-size:11px;color:var(--md-on-surface-variant);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }

    .viewer-body{
      min-height:0;
      position:relative;
      background:var(--md-surface-container-low);
    }

    .empty{
      position:absolute;inset:0;
      display:grid;place-items:center;
      padding:28px;
      text-align:center;
    }
    .empty-card{
      max-width:470px;
      display:flex;flex-direction:column;align-items:center;
    }
    .empty-hero{
      width:86px;height:86px;border-radius:8px;
      display:grid;place-items:center;
      margin-bottom:18px;
      color:var(--md-on-surface-variant);
      background:var(--md-surface-container-high);
      box-shadow:none;
    }
    .empty h2{margin:0 0 8px;font-size:20px;letter-spacing:-.025em}
    .empty p{margin:0 0 18px;max-width:400px;color:var(--md-on-surface-variant);font-size:13px;line-height:1.7}

    .code-wrap{
      position:absolute;inset:0;
      overflow:auto;
      overscroll-behavior:contain;
      outline:none;
    }
    .code-wrap:focus-visible{
      box-shadow:inset 0 0 0 2px var(--md-primary);
    }
    .code-table{
      min-width:100%;
      width:max-content;
      border-collapse:collapse;
      table-layout:auto;
      font:13px/1.68 "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
      tab-size:2;
      padding:8px 0 20px;
    }
    .code-row{height:22px;cursor:default;user-select:none}
    .code-row.selected{background:var(--md-surface-container-highest)}
    .line-no{
      position:sticky;left:0;
      min-width:58px;width:58px;
      padding:0 12px 0 10px;
      text-align:right;
      color:var(--md-on-surface-variant);
      background:var(--md-surface-container-high);
      border-right:1px solid var(--md-outline-variant);
      user-select:none;
      z-index:2;
      touch-action:none;
      -webkit-user-select:none;
    }
    .code-row.selected .line-no{
      color:var(--md-primary);
      background:var(--md-surface-container-highest);
      font-weight:700;
    }
    .line-code{
      white-space:pre;
      padding:0 22px 0 16px;
      color:var(--md-on-surface);
      user-select:none;
      -webkit-user-select:none;
    }
    .line-code::selection{background:var(--md-primary);color:var(--md-on-primary)}

    /* Intentional, high-contrast syntax palette for the code surface. */
    .tok-comment{color:#667085;font-style:italic}
    .tok-string{color:#A23B22}
    .tok-number{color:#087F8C}
    .tok-keyword{color:#5B21B6;font-weight:700}
    .tok-builtin{color:#005B96}
    .tok-function{color:#00695C;font-weight:600}
    .tok-type{color:#9A3412;font-weight:600}
    .tok-macro{color:#B4236A;font-weight:650}
    .tok-lifetime{color:#A15C00}
    .tok-attribute{color:#8A4B08}
    .tok-operator{color:#8B3A00;font-weight:600}
    .tok-tag{color:#9B2C78}
    .tok-punctuation{color:#66707A}

    @media(prefers-color-scheme:dark){
      .tok-comment{color:#A7B0BE}
      .tok-string{color:#FF9B85}
      .tok-number{color:#67D8DD}
      .tok-keyword{color:#C4A7FF}
      .tok-builtin{color:#7CCBFF}
      .tok-function{color:#7DE2C7}
      .tok-type{color:#FFB782}
      .tok-macro{color:#FF9AC6}
      .tok-lifetime{color:#FFD479}
      .tok-attribute{color:#FFC56E}
      .tok-operator{color:#FFB078}
      .tok-punctuation{color:#B8C0CC}
    }

    .image-preview{
      position:absolute;inset:0;
      overflow:auto;
      display:grid;place-items:center;
      padding:24px;
      background-color:var(--md-surface-container-high);
      background-image:
        linear-gradient(45deg,var(--md-surface-container-highest) 25%,transparent 25%,transparent 75%,var(--md-surface-container-highest) 75%),
        linear-gradient(45deg,var(--md-surface-container-highest) 25%,transparent 25%,transparent 75%,var(--md-surface-container-highest) 75%);
      background-position:0 0,10px 10px;
      background-size:20px 20px;
    }
    .image-preview img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 14px 24px rgba(0,0,0,.16));border-radius:6px}

    .unsupported{
      position:absolute;inset:0;display:grid;place-items:center;padding:28px;text-align:center;
    }
    .unsupported strong{display:block;margin-bottom:7px}
    .unsupported span{font-size:13px;color:var(--md-on-surface-variant)}

    /* file browser */
    .files-pane{
      display:grid;
      grid-template-rows:62px minmax(0,1fr);
    }
    .files-toolbar{
      display:flex;align-items:center;gap:8px;
      padding:8px 12px;
      min-width:0;
      border-bottom:1px solid var(--md-outline-variant);
      background:var(--md-surface-container-high);
    }
    .path-title{
      min-width:0;
      margin-left:4px;
      margin-right:auto;
    }
    .folder-title{
      font-size:15px;font-weight:720;letter-spacing:-.015em;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .folder-sub{
      margin-top:2px;
      font-size:11px;color:var(--md-on-surface-variant);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }

    .files-scroll{
      position:relative;
      min-height:0;
      overflow:auto;
      overscroll-behavior:contain;
      padding:18px;
    }
    .files-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(112px,1fr));
      gap:10px;
      align-items:start;
    }

    .file-card{
      min-width:0;
      padding:11px 8px 10px;
      border:0;
      border-radius:4px;
      background:transparent;
      color:inherit;
      text-align:center;
      cursor:pointer;
      transition:background .14s ease,transform .14s ease;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }
    .file-card:active{transform:scale(.97)}
    .file-card.active{background:var(--md-primary);color:var(--md-on-primary)}

    .tile-icon{
      height:68px;
      display:grid;
      place-items:center;
      margin-bottom:7px;
    }
    .folder-svg{width:68px;height:58px;color:var(--md-on-surface-variant)}
    .file-svg{width:52px;height:62px;color:var(--md-on-surface-variant)}
    .file-card.active .folder-svg{color:var(--md-on-primary)}
    .file-card.active .file-svg{color:var(--md-on-primary)}
    .tile-name{
      font-size:12px;font-weight:590;line-height:1.3;
      display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
      overflow:hidden;overflow-wrap:anywhere;
      min-height:31px;
    }
    .tile-meta{font-size:10px;color:var(--md-on-surface-variant);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .file-card.active .tile-meta{color:var(--md-on-primary)}

    .drop-overlay{
      position:fixed;inset:10px;
      z-index:90;
      display:none;place-items:center;
      border:2px dashed var(--md-primary);
      border-radius:8px;
      background:var(--md-surface-container);
      pointer-events:none;
    }
    .drop-overlay.show{display:grid}
    .drop-box{text-align:center;color:var(--md-primary)}
    .drop-box svg{margin:0 auto 12px}
    .drop-box strong{display:block;font-size:18px}
    .drop-box span{display:block;margin-top:5px;font-size:13px;opacity:.75}

    .toast{
      position:fixed;
      left:50%;bottom:22px;
      z-index:120;
      transform:translate(-50%,22px);
      opacity:0;pointer-events:none;
      display:flex;align-items:center;gap:10px;
      max-width:min(520px,calc(100vw - 32px));
      min-height:48px;padding:11px 16px;
      border-radius:16px;
      color:var(--md-surface);
      background:var(--md-on-surface);
      box-shadow:0 12px 32px rgba(0,0,0,.24);
      transition:opacity .18s ease,transform .18s ease;
      font-size:13px;font-weight:620;
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}

    .kbd{
      padding:2px 6px;border-radius:6px;
      border:1px solid var(--md-outline-variant);
      background:var(--md-surface-container-high);
      font:11px/1.4 "SFMono-Regular",Consolas,monospace;
    }

    @media(max-width:720px){
      :root{--topbar-h:calc(66px + env(safe-area-inset-top))}
      .topbar{padding:calc(9px + env(safe-area-inset-top)) 12px 9px}
      .brand-sub{display:none}
      .brand-mark{width:40px;height:40px}
      .upload-label{display:none}
      .workspace{padding:7px 7px 9px}
      .viewer-toolbar{padding-left:11px}
      .files-scroll{padding:10px}
      .files-grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:5px}
      .btn{padding:0 14px}
      .btn-icon{padding:0}
      .active-path{display:none}
      .folder-sub{max-width:190px}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <img src="icon.png" alt="" width="42" height="42" />
        </div>
        <div class="brand-copy">
          <div class="brand-title">代码言然</div>
          <div class="brand-sub" id="zipName">Sentaro</div>
        </div>
      </div>

      <button class="btn btn-filled" id="openZipBtn" type="button">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 15V3m0 0L8 7m4-4 4 4M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="upload-label">ZIPを開く</span>
      </button>
      <input id="zipInput" type="file" accept=".zip,application/zip" />
    </header>

    <main class="workspace" id="workspace">
      <section class="pane viewer-pane" aria-label="ファイルビューア">
        <div class="viewer-toolbar">
          <div class="file-meta">
            <div class="mini-file-icon" id="miniIcon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M7 3.5h7l4 4V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.8"/>
                <path d="M14 3.8V8h4.2" stroke="currentColor" stroke-width="1.8"/>
              </svg>
            </div>
            <div class="file-meta-text">
              <div class="active-file" id="activeFile">ファイルを選択</div>
              <div class="active-path" id="activePath">下のファイル一覧から開けます</div>
            </div>
          </div>

          <button class="btn btn-tonal" id="copyBtn" type="button" disabled title="選択した行をコピー">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="8" y="8" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/>
              <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            <span id="copyLabel">コピー</span>
          </button>
        </div>

        <div class="viewer-body" id="viewerBody">
          <div class="empty" id="viewerEmpty">
            <div class="empty-card">
              <div class="empty-hero">
                <svg width="42" height="42" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M8.5 9.5 5 13l3.5 3.5M15.5 9.5 19 13l-3.5 3.5M14 6l-4 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
              <h2>読み取り専用コードビューア</h2>
              <p>ZIPファイルを開くと、ここにファイル内容が表示されます。行番号をクリックして選択し、そのままコピーできます。</p>
              <button class="btn btn-tonal" type="button" id="emptyOpenBtn">ZIPファイルを選択</button>
            </div>
          </div>
        </div>
      </section>

      <div class="resizer" id="resizer" role="separator" aria-orientation="horizontal" aria-label="ビューアとファイル一覧の高さを変更" tabindex="0"></div>

      <section class="pane files-pane" aria-label="ファイル一覧">
        <div class="files-toolbar">
          <button class="btn btn-icon btn-plain" id="backBtn" type="button" disabled title="戻る" aria-label="戻る">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="path-title">
            <div class="folder-title" id="folderTitle">ファイル</div>
            <div class="folder-sub" id="folderSub">ZIPをアップロードしてください</div>
          </div>
          <button class="btn btn-icon btn-plain" id="rootBtn" type="button" disabled title="ルートへ" aria-label="ルートへ">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m3.5 10.5 8.5-7 8.5 7M5.5 9v10.5h5v-6h3v6h5V9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <div class="files-scroll" id="filesScroll">
          <div class="files-grid" id="filesGrid"></div>
          <div class="empty" id="filesEmpty">
            <div class="empty-card">
              <div class="empty-hero" style="width:72px;height:72px;border-radius:8px">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M3.5 7.5h6l1.7 2H20a1 1 0 0 1 1 1v8.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19V9a1.5 1.5 0 0 1 .5-1.5Z" stroke="currentColor" stroke-width="1.8"/>
                  <path d="M4 9.5h16" stroke="currentColor" stroke-width="1.8"/>
                </svg>
              </div>
              <h2 style="font-size:17px">ZIPの中身がここに表示されます</h2>
              <p>ドラッグ＆ドロップにも対応しています。</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="drop-overlay" id="dropOverlay">
    <div class="drop-box">
      <svg width="54" height="54" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 15V4m0 0L8 8m4-4 4 4M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <strong>ZIPをドロップして開く</strong>
      <span>ファイルはブラウザ内だけで処理されます</span>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const $ = (s) => document.querySelector(s);
      const state = {
        zip: null,
        zipFileName: "",
        root: makeDirNode("", ""),
        cwd: "",
        activePath: "",
        activeText: "",
        activeExt: "",
        lines: [],
        selected: new Set(),
        anchor: null,
        objectUrl: null,
        renderToken: 0
      };

      const els = {
        zipInput: $("#zipInput"),
        openZipBtn: $("#openZipBtn"),
        emptyOpenBtn: $("#emptyOpenBtn"),
        zipName: $("#zipName"),
        workspace: $("#workspace"),
        resizer: $("#resizer"),
        viewerBody: $("#viewerBody"),
        viewerEmpty: $("#viewerEmpty"),
        activeFile: $("#activeFile"),
        activePath: $("#activePath"),
        copyBtn: $("#copyBtn"),
        copyLabel: $("#copyLabel"),
        backBtn: $("#backBtn"),
        rootBtn: $("#rootBtn"),
        folderTitle: $("#folderTitle"),
        folderSub: $("#folderSub"),
        filesGrid: $("#filesGrid"),
        filesEmpty: $("#filesEmpty"),
        filesScroll: $("#filesScroll"),
        dropOverlay: $("#dropOverlay"),
        toast: $("#toast")
      };

      function makeDirNode(name, path) {
        return { type: "dir", name, path, children: new Map() };
      }

      function makeFileNode(name, path, zipEntry) {
        return { type: "file", name, path, zipEntry };
      }

      function iconFolder() {
        return `
          <svg class="folder-svg" viewBox="0 0 72 60" fill="none" aria-hidden="true">
            <path d="M5 15.5a6 6 0 0 1 6-6h18l6.2 7H61a6 6 0 0 1 6 6v26a6 6 0 0 1-6 6H11a6 6 0 0 1-6-6v-33Z" fill="currentColor"/>
            <path d="M5 22.5h62v26a6 6 0 0 1-6 6H11a6 6 0 0 1-6-6v-26Z" fill="currentColor" opacity=".86"/>
            <path d="M11 9.5h18l6.2 7H61" stroke="rgba(255,255,255,.48)" stroke-width="1.4" stroke-linecap="round"/>
          </svg>`;
      }

      function iconFile(ext) {
        const label = (ext || "FILE").slice(0,5).toUpperCase();
        return `
          <svg class="file-svg" viewBox="0 0 58 68" fill="none" aria-hidden="true">
            <path d="M9 3h25l15 15v43a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Z" fill="currentColor" opacity=".13"/>
            <path d="M9 3h25l15 15v43a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Z" stroke="currentColor" stroke-width="1.7"/>
            <path d="M34 3v15h15" stroke="currentColor" stroke-width="1.7"/>
            <rect x="10" y="41" width="34" height="14" rx="5" fill="currentColor"/>
            <text x="27" y="51.2" text-anchor="middle" font-size="7" font-weight="800" fill="var(--md-on-primary)" font-family="system-ui,sans-serif">${escapeHtml(label)}</text>
          </svg>`;
      }

      function getExt(name) {
        const i = name.lastIndexOf(".");
        return i > 0 ? name.slice(i + 1).toLowerCase() : "";
      }

      function formatBytes(bytes) {
        if (bytes === undefined || bytes === null || Number.isNaN(bytes)) return "";
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024**2) return `${(bytes/1024).toFixed(bytes < 10240 ? 1 : 0)} KB`;
        return `${(bytes/1024**2).toFixed(bytes < 10*1024**2 ? 1 : 0)} MB`;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&","&amp;")
          .replaceAll("<","&lt;")
          .replaceAll(">","&gt;")
          .replaceAll('"',"&quot;")
          .replaceAll("'","&#039;");
      }

      function cleanPath(path) {
        return path.split("/").filter(Boolean).join("/");
      }

      function parentPath(path) {
        const parts = cleanPath(path).split("/").filter(Boolean);
        parts.pop();
        return parts.join("/");
      }

      function currentNode() {
        if (!state.cwd) return state.root;
        let node = state.root;
        for (const part of state.cwd.split("/").filter(Boolean)) {
          node = node.children.get(part);
          if (!node || node.type !== "dir") return state.root;
        }
        return node;
      }

      function buildTree(zip) {
        const root = makeDirNode("", "");
        for (const [rawPath, entry] of Object.entries(zip.files)) {
          const normalized = rawPath.replaceAll("\\", "/").replace(/^\/+/, "");
          const parts = normalized.split("/").filter(Boolean);
          if (!parts.length) continue;

          let cursor = root;
          let accum = "";
          for (let i = 0; i < parts.length; i++) {
            const name = parts[i];
            accum = accum ? `${accum}/${name}` : name;
            const isLast = i === parts.length - 1;
            const isDir = !isLast || entry.dir;

            if (isDir) {
              if (!cursor.children.has(name) || cursor.children.get(name).type !== "dir") {
                cursor.children.set(name, makeDirNode(name, accum));
              }
              cursor = cursor.children.get(name);
            } else {
              cursor.children.set(name, makeFileNode(name, accum, entry));
            }
          }
        }
        return root;
      }

      function childCounts(node) {
        let folders = 0, files = 0;
        for (const child of node.children.values()) {
          child.type === "dir" ? folders++ : files++;
        }
        return {folders, files};
      }

      function renderBrowser() {
        const node = currentNode();
        const children = [...node.children.values()].sort((a,b) => {
          if (a.type !== b.type) return a.type === "dir" ? -1 : 1;
          return a.name.localeCompare(b.name, "ja", { numeric:true, sensitivity:"base" });
        });

        els.filesGrid.innerHTML = "";
        els.filesEmpty.style.display = state.zip && children.length === 0 ? "grid" : "none";
        if (!state.zip) {
          els.filesEmpty.style.display = "grid";
          els.filesGrid.style.display = "none";
        } else {
          els.filesGrid.style.display = "grid";
        }

        const label = state.cwd ? state.cwd.split("/").pop() : (state.zipFileName.replace(/\.zip$/i,"") || "ZIP");
        els.folderTitle.textContent = label || "ZIP";
        const counts = childCounts(node);
        els.folderSub.textContent = state.cwd
          ? `/${state.cwd}  ·  ${counts.folders}フォルダ、${counts.files}ファイル`
          : `${counts.folders}フォルダ、${counts.files}ファイル`;
        els.backBtn.disabled = !state.cwd;
        els.rootBtn.disabled = !state.cwd;

        for (const item of children) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "file-card" + (item.path === state.activePath ? " active" : "");
          btn.dataset.path = item.path;

          const ext = item.type === "file" ? getExt(item.name) : "";
          const size = item.type === "file" ? item.zipEntry?._data?.uncompressedSize : null;

          btn.innerHTML = `
            <div class="tile-icon">${item.type === "dir" ? iconFolder() : iconFile(ext)}</div>
            <div class="tile-name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
            <div class="tile-meta">${item.type === "dir" ? "フォルダ" : (ext ? ext.toUpperCase() + (size != null ? " · " + formatBytes(size) : "") : formatBytes(size))}</div>`;

          btn.addEventListener("click", () => {
            if (item.type === "dir") {
              state.cwd = item.path;
              renderBrowser();
              els.filesScroll.scrollTop = 0;
            } else {
              openFile(item);
            }
          });
          els.filesGrid.appendChild(btn);
        }
      }

      const imageExts = new Set(["png","jpg","jpeg","gif","webp","svg","bmp","ico","avif"]);
      const likelyTextExts = new Set([
        "txt","md","markdown","html","htm","css","scss","sass","less","js","mjs","cjs","jsx","ts","tsx","json","jsonc",
        "xml","yaml","yml","toml","ini","cfg","conf","env","gitignore","gitattributes","editorconfig","npmrc","babelrc",
        "py","rb","php","java","kt","kts","swift","go","rs","c","h","cpp","hpp","cc","cs","sh","bash","zsh","fish","ps1",
        "sql","graphql","gql","vue","svelte","astro","dart","lua","r","pl","ex","exs","erl","hrl","clj","cljs","scala",
        "gradle","properties","lock","csv","tsv","log","dockerfile","makefile"
      ]);

      function likelyText(name, bytes) {
        const ext = getExt(name);
        const base = name.toLowerCase();
        if (likelyTextExts.has(ext) || ["dockerfile","makefile","license","readme","changelog"].some(x => base === x || base.startsWith(x+"."))) return true;
        const sample = bytes.subarray(0, Math.min(bytes.length, 4096));
        if (!sample.length) return true;
        let zero = 0, suspicious = 0;
        for (const b of sample) {
          if (b === 0) zero++;
          if (b < 9 || (b > 13 && b < 32)) suspicious++;
        }
        return zero === 0 && suspicious / sample.length < 0.03;
      }

      function decodeText(bytes) {
        const utf8 = new TextDecoder("utf-8", { fatal:false }).decode(bytes);
        const bad = (utf8.match(/\uFFFD/g) || []).length;
        if (bad <= Math.max(2, utf8.length * .002)) return utf8;

        try {
          const sjis = new TextDecoder("shift-jis", { fatal:false }).decode(bytes);
          const sjisBad = (sjis.match(/\uFFFD/g) || []).length;
          return sjisBad < bad ? sjis : utf8;
        } catch {
          return utf8;
        }
      }

      function setFileHeader(name, path) {
        els.activeFile.textContent = name;
        els.activePath.textContent = "/" + path;
      }

      const syntax = {
        keywords: new Set("as async await break case catch class const continue debugger default delete do else export extends finally for from function if import in instanceof let new of return static super switch this throw try typeof var void while with yield def and or not is lambda pass raise True False None async await public private protected interface implements package type enum struct fn let mut match impl trait use mod pub crate where go defer chan map range select switch fallthrough func return const var if else for class extends new try catch finally throw import export from as in of typeof instanceof null undefined true false this self print echo SELECT FROM WHERE INSERT UPDATE DELETE CREATE TABLE ALTER AND OR NOT JOIN ON GROUP BY ORDER LIMIT".split(/\s+/)),
        builtins: new Set("console Math JSON Date Array Object String Number Boolean Promise RegExp Set Map Error window document fetch len range print str int float list dict set self True False None".split(/\s+/)),
        rustKeywords: new Set("as async await break const continue crate dyn else enum extern false fn for if impl in let loop match mod move mut pub ref return self Self static struct super trait true type unsafe use where while abstract become box do final macro override priv typeof unsized virtual yield try union".split(/\s+/)),
        rustTypes: new Set("bool char str i8 i16 i32 i64 i128 isize u8 u16 u32 u64 u128 usize f32 f64 String Vec Option Result Box Rc Arc HashMap HashSet Some None Ok Err Self".split(/\s+/)),
        rustBuiltins: new Set("println print eprintln eprint format vec panic todo unimplemented dbg assert assert_eq assert_ne cfg include_bytes include_str".split(/\s+/))
      };

      function tokenSpan(kind, value) {
        return `<span class="tok-${kind}">${escapeHtml(value)}</span>`;
      }

      function highlightRustLine(line) {
        const pattern = /\/\/.*|\/\*[\s\S]*?\*\/|#!?\[[^\]]*\]|r##?".*?"##?|r#?".*?"#?|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])'|'[A-Za-z_][\w]*|\b(?:0x[\da-fA-F_]+|0b[01_]+|\d[\d_]*(?:\.\d+)?)\b|[A-Za-z_][\w]*|=>|::|->|==|!=|<=|>=|&&|\|\||[{}[\]();,.<>:+*\-/=%!?&|^~]/g;
        let out = "", last = 0, match;
        while ((match = pattern.exec(line))) {
          out += escapeHtml(line.slice(last, match.index));
          const value = match[0];
          const after = line.slice(match.index + value.length);
          let kind = "punctuation";
          if (/^\/\//.test(value) || /^\/\*/.test(value)) kind = "comment";
          else if (/^#!?\[/.test(value)) kind = "attribute";
          else if (/^r#?"|^r##?"|^[\"]|^'[^A-Za-z_]/.test(value)) kind = "string";
          else if (/^'[A-Za-z_]/.test(value)) kind = "lifetime";
          else if (/^(?:0x|0b|\d)/.test(value)) kind = "number";
          else if (syntax.rustKeywords.has(value)) kind = "keyword";
          else if (syntax.rustTypes.has(value) || /^[A-Z][A-Za-z0-9_]*$/.test(value)) kind = "type";
          else if (syntax.rustBuiltins.has(value) || /!/.test(after.match(/^\s*!/)?.[0] || "")) kind = "macro";
          else if (/^\s*\(/.test(after)) kind = "function";
          else if (/^(?:=>|::|->|==|!=|<=|>=|&&|\|\||[+*\-/=%!?&|^~<>])/.test(value)) kind = "operator";
          out += tokenSpan(kind, value);
          last = match.index + value.length;
        }
        return out + escapeHtml(line.slice(last));
      }

      function highlightLine(line, ext) {
        if (!line) return " ";
        if (ext === "rs") return highlightRustLine(line);
        const isMarkup = ["html","htm","xml","svg","vue","svelte","astro"].includes(ext);
        const pattern = /<!--[\s\S]*?-->|\/\/.*|\/\*[\s\S]*?\*\/|'(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*"|`(?:\\.|[^`\\])*`|\b\d+(?:\.\d+)?\b|\b[A-Za-z_$][\w$-]*\b|[<>/{}[\]();,.：:]/g;
        let out = "", last = 0, match;
        while ((match = pattern.exec(line))) {
          out += escapeHtml(line.slice(last, match.index));
          const value = match[0];
          let kind = "punctuation";
          if (/^<!--|^\/\//.test(value) || /^\/\*/.test(value)) kind = "comment";
          else if (/^['"`]/.test(value)) kind = "string";
          else if (/^\d/.test(value)) kind = "number";
          else if (isMarkup && /^<|^\/?$/.test(value)) kind = "tag";
          else if (syntax.keywords.has(value)) kind = "keyword";
          else if (syntax.builtins.has(value)) kind = "builtin";
          else if (/^[A-Za-z_$]/.test(value) && /^\s*\(/.test(line.slice(match.index + value.length))) kind = "function";
          else if (/^[{}[\]();,.：:]/.test(value)) kind = "punctuation";
          out += tokenSpan(kind, value);
          last = match.index + value.length;
        }
        return out + escapeHtml(line.slice(last));
      }

      function clearPreviewObjectUrl() {
        if (state.objectUrl) {
          URL.revokeObjectURL(state.objectUrl);
          state.objectUrl = null;
        }
      }

      async function openFile(item) {
        const token = ++state.renderToken;
        state.activePath = item.path;
        state.activeExt = getExt(item.name);
        state.selected.clear();
        state.anchor = null;
        updateCopyButton();
        clearPreviewObjectUrl();
        setFileHeader(item.name, item.path);
        renderBrowser();

        els.viewerBody.innerHTML = `<div class="empty"><div class="empty-card"><p>読み込み中…</p></div></div>`;

        try {
          const bytes = await item.zipEntry.async("uint8array");
          if (token !== state.renderToken) return;

          const ext = getExt(item.name);
          if (imageExts.has(ext)) {
            const mime = {
              png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",
              svg:"image/svg+xml",bmp:"image/bmp",ico:"image/x-icon",avif:"image/avif"
            }[ext] || "application/octet-stream";
            const blob = new Blob([bytes], {type:mime});
            state.objectUrl = URL.createObjectURL(blob);
            els.viewerBody.innerHTML = `<div class="image-preview"><img alt="${escapeHtml(item.name)}" src="${state.objectUrl}"></div>`;
            return;
          }

          if (!likelyText(item.name, bytes)) {
            els.viewerBody.innerHTML = `
              <div class="unsupported">
                <div>
                  <strong>このファイルはテキストとして表示できません</strong>
                  <span>${escapeHtml(item.name)} · ${formatBytes(bytes.length)}</span>
                </div>
              </div>`;
            return;
          }

          const text = decodeText(bytes).replace(/\r\n?/g,"\n");
          state.activeText = text;
          state.lines = text.split("\n");
          renderCode(state.activeExt);
        } catch (err) {
          console.error(err);
          els.viewerBody.innerHTML = `
            <div class="unsupported">
              <div>
                <strong>ファイルを開けませんでした</strong>
                <span>${escapeHtml(err?.message || "Unknown error")}</span>
              </div>
            </div>`;
        }
      }

      function renderCode(ext = state.activeExt) {
        const wrap = document.createElement("div");
        wrap.className = "code-wrap";
        wrap.tabIndex = 0;
        wrap.setAttribute("aria-label","コード。行番号をクリックして行を選択できます。");

        const table = document.createElement("table");
        table.className = "code-table";
        const body = document.createElement("tbody");

        state.lines.forEach((line, index) => {
          const row = document.createElement("tr");
          row.className = "code-row";
          row.dataset.line = index;

          const no = document.createElement("td");
          no.className = "line-no";
          no.textContent = index + 1;

          const code = document.createElement("td");
          code.className = "line-code";
          code.innerHTML = highlightLine(line, ext);

          row.append(no, code);
          body.appendChild(row);
        });

        table.appendChild(body);
        wrap.appendChild(table);
        els.viewerBody.replaceChildren(wrap);

        let dragging = false;
        let dragStart = null;

        body.addEventListener("pointerdown", (e) => {
          const row = e.target.closest(".code-row");
          if (!row) return;

          // コード本文はネイティブの文字選択も使えるようにする。
          if (e.target.closest(".line-code") && !e.shiftKey && !e.metaKey && !e.ctrlKey) return;

          e.preventDefault();
          dragging = true;
          dragStart = Number(row.dataset.line);
          selectLine(dragStart, e.shiftKey, e.metaKey || e.ctrlKey);
          try { body.setPointerCapture(e.pointerId); } catch {}
        });

        body.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          const point = document.elementFromPoint(e.clientX, e.clientY);
          const row = point?.closest?.(".code-row");
          if (!row) return;
          const current = Number(row.dataset.line);
          state.selected.clear();
          const a = Math.min(dragStart, current);
          const b = Math.max(dragStart, current);
          for (let i=a;i<=b;i++) state.selected.add(i);
          state.anchor = dragStart;
          paintSelection();
        });

        body.addEventListener("pointerup", () => dragging = false);
        body.addEventListener("pointercancel", () => dragging = false);

        body.addEventListener("click", (e) => {
          const row = e.target.closest(".code-row");
          if (!row || e.target.closest(".line-no")) return;
          if (window.getSelection()?.toString()) return;
          const i = Number(row.dataset.line);
          selectLine(i, e.shiftKey, e.metaKey || e.ctrlKey);
        });

        wrap.addEventListener("keydown", (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "a") {
            e.preventDefault();
            state.selected = new Set(state.lines.map((_,i)=>i));
            state.anchor = 0;
            paintSelection();
          }
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "c" && state.selected.size) {
            const sel = window.getSelection()?.toString();
            if (!sel) {
              e.preventDefault();
              copySelected();
            }
          }
          if (e.key === "Escape") {
            state.selected.clear();
            state.anchor = null;
            paintSelection();
          }
        });
      }

      function selectLine(index, shift, toggle) {
        if (shift && state.anchor !== null) {
          state.selected.clear();
          const a = Math.min(state.anchor, index);
          const b = Math.max(state.anchor, index);
          for (let i=a;i<=b;i++) state.selected.add(i);
        } else if (toggle) {
          if (state.selected.has(index)) state.selected.delete(index);
          else state.selected.add(index);
          state.anchor = index;
        } else {
          state.selected.clear();
          state.selected.add(index);
          state.anchor = index;
        }
        paintSelection();
      }

      function paintSelection() {
        els.viewerBody.querySelectorAll(".code-row").forEach(row => {
          row.classList.toggle("selected", state.selected.has(Number(row.dataset.line)));
        });
        updateCopyButton();
      }

      function selectedText() {
        if (!state.selected.size) return "";
        const indices = [...state.selected].sort((a,b)=>a-b);
        return `${indices.map(i => state.lines[i] ?? "").join("\n")}\n\nこのコードを小さい単位で簡単に解説してください。丁寧だが簡潔にお願いします。コードがしてることは1行程度で解説して，このコードがどのような文法で書かれているかのような今後の学習知識をつける形で一番最初にまとめて。例えば変数ならば"，この部分は変数の定義で，変数はこのように書くからこれはこんな意味になる"というような。`;
      }

      function selectionLabel() {
        if (!state.selected.size) return "コピー";
        const indices = [...state.selected].sort((a,b)=>a-b);
        if (indices.length === 1) return `L${indices[0]+1} をコピー`;
        const consecutive = indices.every((v,i) => i === 0 || v === indices[i-1]+1);
        return consecutive
          ? `L${indices[0]+1}–${indices.at(-1)+1} をコピー`
          : `${indices.length}行をコピー`;
      }

      function updateCopyButton() {
        els.copyBtn.disabled = state.selected.size === 0;
        els.copyLabel.textContent = selectionLabel();
      }

      async function copySelected() {
        const text = selectedText();
        if (!text) return;
        try {
          await navigator.clipboard.writeText(text);
          toast(`${state.selected.size}行をコピーしました`);
        } catch {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
          toast(`${state.selected.size}行をコピーしました`);
        }
      }

      let toastTimer;
      function toast(message) {
        clearTimeout(toastTimer);
        els.toast.textContent = message;
        els.toast.classList.add("show");
        toastTimer = setTimeout(() => els.toast.classList.remove("show"), 1800);
      }

      async function loadZip(file) {
        if (!file) return;
        if (!/\.zip$/i.test(file.name) && file.type !== "application/zip" && file.type !== "application/x-zip-compressed") {
          toast("ZIPファイルを選択してください");
          return;
        }
        if (!window.JSZip) {
          toast("ZIPライブラリを読み込めませんでした。インターネット接続を確認してください");
          return;
        }

        els.zipName.textContent = "ZIPを読み込み中…";
        try {
          const zip = await JSZip.loadAsync(file);
          clearPreviewObjectUrl();
          state.zip = zip;
          state.zipFileName = file.name;
          state.root = buildTree(zip);
          state.cwd = "";
          state.activePath = "";
          state.activeText = "";
          state.lines = [];
          state.selected.clear();
          state.anchor = null;

          els.zipName.textContent = file.name;
          els.viewerBody.innerHTML = `
            <div class="empty">
              <div class="empty-card">
                <div class="empty-hero">
                  <svg width="42" height="42" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M8.5 9.5 5 13l3.5 3.5M15.5 9.5 19 13l-3.5 3.5M14 6l-4 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
                <h2>ファイルを選択してください</h2>
                <p>下のファイル一覧から、閲覧したいファイルを開いてください。</p>
              </div>
            </div>`;
          els.activeFile.textContent = "ファイルを選択";
          els.activePath.textContent = `${file.name} の内容`;
          updateCopyButton();
          renderBrowser();
          toast(`${file.name} を開きました`);
        } catch (err) {
          console.error(err);
          els.zipName.textContent = "Sentaro";
          toast("ZIPファイルを読み込めませんでした");
        } finally {
          els.zipInput.value = "";
        }
      }

      els.openZipBtn.addEventListener("click", () => els.zipInput.click());
      els.emptyOpenBtn.addEventListener("click", () => els.zipInput.click());
      els.zipInput.addEventListener("change", () => loadZip(els.zipInput.files?.[0]));
      els.copyBtn.addEventListener("click", copySelected);

      els.backBtn.addEventListener("click", () => {
        if (!state.cwd) return;
        state.cwd = parentPath(state.cwd);
        renderBrowser();
        els.filesScroll.scrollTop = 0;
      });

      els.rootBtn.addEventListener("click", () => {
        state.cwd = "";
        renderBrowser();
        els.filesScroll.scrollTop = 0;
      });

      // Split pane resize
      let resizing = false;

      function setSplitFromY(clientY) {
        const rect = els.workspace.getBoundingClientRect();
        const usable = rect.height - 12;
        const y = clientY - rect.top;
        const minTop = Math.min(150, usable * .34);
        const minBottom = Math.min(155, usable * .34);
        const clamped = Math.max(minTop, Math.min(y, usable - minBottom));
        const pct = clamped / usable * 100;
        document.documentElement.style.setProperty("--split", `${pct}%`);
      }

      els.resizer.addEventListener("pointerdown", (e) => {
        resizing = true;
        els.resizer.classList.add("dragging");
        els.resizer.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      els.resizer.addEventListener("pointermove", (e) => {
        if (resizing) setSplitFromY(e.clientY);
      });
      els.resizer.addEventListener("pointerup", () => {
        resizing = false;
        els.resizer.classList.remove("dragging");
      });
      els.resizer.addEventListener("pointercancel", () => {
        resizing = false;
        els.resizer.classList.remove("dragging");
      });
      els.resizer.addEventListener("keydown", (e) => {
        if (!["ArrowUp","ArrowDown","Home"].includes(e.key)) return;
        e.preventDefault();
        const current = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--split")) || 58;
        if (e.key === "Home") document.documentElement.style.setProperty("--split","58%");
        else {
          const next = Math.max(28, Math.min(72, current + (e.key === "ArrowDown" ? 3 : -3)));
          document.documentElement.style.setProperty("--split", `${next}%`);
        }
      });

      // Drag & drop ZIP
      let dragDepth = 0;
      window.addEventListener("dragenter", (e) => {
        if ([...e.dataTransfer?.items || []].some(i => i.kind === "file")) {
          dragDepth++;
          els.dropOverlay.classList.add("show");
        }
      });
      window.addEventListener("dragover", (e) => {
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = "copy";
      });
      window.addEventListener("dragleave", () => {
        dragDepth = Math.max(0, dragDepth - 1);
        if (!dragDepth) els.dropOverlay.classList.remove("show");
      });
      window.addEventListener("drop", (e) => {
        e.preventDefault();
        dragDepth = 0;
        els.dropOverlay.classList.remove("show");
        const file = [...e.dataTransfer.files].find(f => /\.zip$/i.test(f.name)) || e.dataTransfer.files[0];
        loadZip(file);
      });

      // Touch-first feedback: a short Material-style ripple replaces hover affordances.
      document.addEventListener("pointerdown", (e) => {
        const target = e.target.closest(".btn, .file-card");
        if (!target || target.disabled) return;
        const rect = target.getBoundingClientRect();
        const ripple = document.createElement("span");
        ripple.className = "ripple";
        ripple.style.left = `${e.clientX - rect.left}px`;
        ripple.style.top = `${e.clientY - rect.top}px`;
        target.appendChild(ripple);
        ripple.addEventListener("animationend", () => ripple.remove(), {once:true});
      });

      renderBrowser();
    })();
  </script>
</body>
</html>
