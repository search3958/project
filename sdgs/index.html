<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDGs Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <nav class="sidebar">
    <button class="active" data-target="discover">発見</button>
    <button data-target="knowledge">知識</button>
    <button data-target="post">投稿</button>
  </nav>
  <main class="content">
    <section id="discover" class="panel active">
      <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="M423.5-103.5Q400-127 400-160h160q0 33-23.5 56.5T480-80q-33 0-56.5-23.5ZM320-200v-80h320v80H320Zm10-120q-69-41-109.5-110T180-580q0-125 87.5-212.5T480-880q125 0 212.5 87.5T780-580q0 81-40.5 150T630-320H330Zm24-80h252q45-32 69.5-79T700-580q0-92-64-156t-156-64q-92 0-156 64t-64 156q0 54 24.5 101t69.5 79Zm126 0Z"/></svg>
      <h2>自分なりの解決方法を発見</h2>
      <p>10の質問に回答して自分に適した解決方法を探しましょう</p>

      <div class="answer-card" style="width:300px;height:100px;">
        回答方法
      </div>

      <button class="answer-m3btn">
        <svg xmlns="http://www.w3.org/2000/svg" style="display:block;" height="40px" viewBox="0 -960 960 960" width="40px" fill="#000000"><path d="M647-440H200q-17 0-28.5-11.5T160-480q0-17 11.5-28.5T200-520h447L451-716q-12-12-11.5-28t12.5-28q12-11 28-11.5t28 11.5l264 264q6 6 8.5 13t2.5 15q0 8-2.5 15t-8.5 13L508-188q-11 11-27.5 11T452-188q-12-12-12-28.5t12-28.5l195-195Z"/></svg>
        開始
      </button>

    </section>

    <section id="knowledge" class="panel">
      <h2>知識</h2>
      <article>
        <p>SDGs（持続可能な開発目標）は、2015年に国連で採択された17の目標です。</p>
        <p>2030年までに達成することが目指されています。</p>
      </article>
    </section>
    <section id="post" class="panel">
      <h2>投稿</h2>
      <form>
        <input type="text" placeholder="タイトル">
        <textarea placeholder="内容"></textarea>
        <button type="button">投稿する</button>
      </form>
    </section>
  </main>
</div>

<script>
document.querySelector('.sidebar').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById(e.target.dataset.target).classList.add('active');
});
</script>

</body>
</html>
